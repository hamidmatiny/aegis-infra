name: aegis-infra
display_name: AEGIS Infra
description: |
  Head of Infrastructure & Compute for Hamid's personal agent company (built on
  Trinity). Owns model/provider/tier assignment for every other agent, configures
  and audits OmniRoute (the fleet's local multi-provider AI gateway), tracks
  token/cost usage weekly, and re-checks provider pricing and free-tier terms as
  they change. Reports to aegis-ceo. Not customer-facing; does no analysis work
  of its own — makes the other agents' work possible and affordable.
avatar_prompt: |
  A calm, unassuming systems engineer in their late 30s, sitting at a modest desk in
  a small server/network-operations room lit mostly by monitor glow and a few status
  LEDs — no glass office, no skyline. Plain dark crewneck sweater, sleeves pushed up,
  a well-worn mechanical keyboard, a lukewarm mug of coffee. Three unglamorous monitors
  show plain dashboards: routing tables, a cost graph trending flat, a green status
  grid. Their expression is quietly attentive, unbothered, the look of someone who
  finds a boring, stable system satisfying rather than someone chasing excitement.
  Muted teal-and-amber lighting, slightly desaturated, photorealistic, understated —
  deliberately the least flashy portrait in the company.
resources:
  cpu: "1"
  memory: "2g"

# Claude Code plugins this agent needs — DECLARED, not typed (trinity#1704). Trinity materializes
# this as a committed ~/.trinity/plugins.yaml and re-installs it headlessly on every container
# boot, so the deployed agent has them without anyone running /plugin install. Mirror CLAUDE.md.
plugins:
  marketplaces:
    - name: abilityai
      source: abilityai/abilities
  installed:
    - agent-dev@abilityai
    - trinity@abilityai
    - utilities@abilityai

# What this agent needs, BY NAME ONLY — names-only is the frozen contract; never values.
# Every ${VAR} used in .mcp.json.template must appear here or the agent HARD-fails
# compatibility check T-015. OMNIROUTE_API_KEY is optional — a purely local gateway may
# run with no auth; credential_setup below marks it not required.
credentials:
  env_file: [OMNIROUTE_API_URL, OMNIROUTE_API_KEY]

# Per-variable setup guidance (ent#128). DECORATES credentials: — it cannot declare a
# name that isn't above (undeclared entries are dropped). Drives the platform's guided
# checklist: GET /api/agents/{name}/credential-requirements (ent#127).
credential_setup:
  - name: OMNIROUTE_API_URL
    title: OmniRoute gateway URL
    description: Base URL of the running OmniRoute instance this agent audits and configures.
    required: true
    secret: false
    format: url
  - name: OMNIROUTE_API_KEY
    title: OmniRoute admin/API key
    description: Only needed if this OmniRoute instance requires auth for its admin/config API. Leave unset for a no-auth local instance.
    required: false
    secret: true
    format: secret

# This agent runs itself in the free-pool tier by its own policy (see CLAUDE.md
# Guidelines: "Be the boring one") — it should not consume Hamid's Claude Pro
# subscription once OmniRoute's free tier is confirmed working end-to-end.

# Recommended schedules (design source of truth). Trinity materializes this block ON
# AGENT CREATION, deduplicated by `name` — at most 20 entries, and NEVER re-applied on
# recreate, so a schedule added here after deployment must be created with
# create_agent_schedule (or reconciled by /trinity:onboard | /trinity:sync).
# `enabled` is the recommended default and only a literal YAML true arms a schedule;
# firing ALSO requires the agent's autonomy gate, which is OFF on every new agent.
schedules:
  - name: Weekly usage rollup
    cron: "0 8 * * 1"
    timezone: UTC
    message: "Run the weekly token/cost usage rollup across all agents and flag anything unusual to the CEO."
    purpose: Cost/usage tracking (core mission #3)
    enabled: false
  - name: Pricing & free-tier re-check
    cron: "0 9 */14 * *"
    timezone: UTC
    message: "Re-check provider pricing and free-tier terms for every model this fleet currently uses. Propose rebalancing only if something changed materially."
    purpose: Catch provider pricing/free-tier drift (core mission #4)
    enabled: false
  - name: Dashboard refresh
    cron: "0 */6 * * *"
    timezone: UTC
    message: "Refresh dashboard.yaml with current tier/cost metrics."
    purpose: Keep the fleet cost/tier snapshot current
    enabled: false
  - name: Doc reconciliation
    cron: "0 9 * * 1"
    timezone: UTC
    message: "Run /reconcile-docs and report any drift found. Report-only — do not apply fixes on a scheduled run."
    purpose: Weekly doc/skill/architecture coherence check
    enabled: false
